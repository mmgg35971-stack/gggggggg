# Builds the installable Android APK on GitHub's runners.
# Every push to main (and every manual run) produces an APK you can download from
# the run's "Artifacts" section; pushes to main also refresh the "latest" release.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME) with licences accepted;
      # Gradle fetches any missing platform itself.
      - name: Install dependencies
        run: npm ci

      - name: Test the game systems
        run: npm test

      - name: Build web bundle and sync Android project
        run: npm run cap:sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dimmering-vale.apk

      - uses: actions/upload-artifact@v5
        with:
          name: dimmering-vale-apk
          path: dimmering-vale.apk

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dimmering-vale.apk \
            --title "Dimmering Vale (latest build)" \
            --notes "Built from ${GITHUB_SHA}. Install on Android: download the APK and allow installs from this source."
