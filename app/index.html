<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0b08">
  <title>Chronicles of the Dimmering Vale</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M7 8V6a5 5 0 0 1 10 0v2"/><path d="M4 8h16l-1.5 12h-13z"/><path d="M9 12h6"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6M9 10h6"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M14 15c3.5-.5 7 1.5 7 5"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 0 4H8v10a2 2 0 1 1-4 0V6a2 2 0 0 1 2-2z"/><path d="M8 8h10v10a2 2 0 0 1-2 2H6"/><path d="M11 12h4M11 15h4"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
      <symbol id="i-quill" viewBox="0 0 24 24"><path d="M20 3c-6 1-11 5-13 12l-2 6"/><path d="M20 3c0 6-4 11-11 12"/><path d="M9 15l-3-3"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
      <symbol id="crest" viewBox="0 0 120 120">
        <path d="M60 6 L104 22 V58 C104 86 84 104 60 114 C36 104 16 86 16 58 V22 Z" fill="#2a1a0f" stroke="#c9a14a" stroke-width="3"/>
        <path d="M60 16 L95 29 V58 C95 80 79 95 60 103 C41 95 25 80 25 58 V29 Z" fill="none" stroke="#8c6d2c" stroke-width="1.2"/>
        <rect x="55" y="40" width="10" height="38" rx="2" fill="#e9dcc0"/>
        <path d="M60 28 C66 36 64 40 60 40 C56 40 54 36 60 28 Z" fill="none" stroke="#c9a14a" stroke-width="1.5" stroke-dasharray="2 2"/>
        <path d="M40 84 Q60 74 80 84" fill="none" stroke="#8e1b12" stroke-width="3"/>
        <circle cx="60" cy="84" r="3" fill="#8e1b12"/>
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    </defs>
  </svg>

  <!-- audio needs a gesture on phones -->
  <div id="veil" class="tap-veil"><div>
    <svg class="crest" viewBox="0 0 120 120" aria-hidden="true"><use href="#crest"/></svg>
    <p data-i18n="tapToBegin">انقر لتبدأ</p>
  </div></div>

  <section id="title" class="screen hidden">
    <button class="btn small lang-toggle" id="langBtn">English</button>
    <svg class="crest" viewBox="0 0 120 120" aria-hidden="true">

      <use href="#crest"/>
    </svg>
    <h1 class="game-title" data-i18n="title">حوليات وادي الغسق</h1>
    <div class="game-sub" data-i18n="subtitle">لعبة تقمّص أدوار في عالم مظلم من العصور الوسطى</div>
    <div class="rule">✠</div>
    <div class="menu">
      <button class="btn primary" id="newBtn" data-i18n="newChronicle">حولية جديدة</button>
      <button class="btn" id="continueBtn" data-i18n="continue">متابعة</button>
      <button class="btn" id="titleSettingsBtn" data-i18n="settings">الإعدادات</button>
    </div>
    <div class="ballad" id="ballad" aria-label="ballad"></div>
  </section>

  <section id="create" class="screen hidden">
    <div class="sheet parchment">
      <h2 data-i18n="createTitle">من أنت؟</h2>
      <div class="rule" style="color:#8e1b12">❧</div>
      <h3 data-i18n="name">الاسم</h3>
      <input class="field" id="cName" maxlength="32" autocomplete="off">
      <h3 data-i18n="pronoun">كيف يُشار إليك</h3>
      <select class="field" id="cGender">
        <option value="unspecified" data-i18n="gUnspecified">دون تحديد</option>
        <option value="male" data-i18n="gMale">رجل</option>
        <option value="female" data-i18n="gFemale">امرأة</option>
      </select>
      <h3 data-i18n="background">الماضي</h3>
      <div class="bg-grid" id="bgGrid"></div>
      <h3 data-i18n="attributes">الخصائص</h3>
      <div class="stats" id="statGrid"></div>
      <div class="points" id="points"></div>
      <div class="err" id="cErr"></div>
      <div class="create-actions">
        <button class="btn" id="cBack" data-i18n="back">رجوع</button>
        <button class="btn primary" id="cStart" data-i18n="begin">ابدأ الحولية</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="place"><div class="name" id="placeName"></div><div class="when" id="placeWhen"></div></div>
      <div class="vitals">
        <span title="HP"><span class="hp"><i id="hpBar"></i></span></span>
        <span class="coin" id="gold"></span>
        <button class="iconbtn" id="musicBtn" aria-label="music"><svg class="i"><use href="#i-note"/></svg></button>
      </div>
    </header>
    <main id="log" aria-live="polite"></main>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" data-i18n-ph="inputPh" placeholder="اكتب ما تفعله أو تقوله..."></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="send"><svg class="i"><use href="#i-quill"/></svg></button>
    </form>
    <nav class="tabs">
      <button data-panel="character"><svg class="i"><use href="#i-person"/></svg><span data-i18n="tCharacter">الشخصية</span></button>
      <button data-panel="inventory"><svg class="i"><use href="#i-bag"/></svg><span data-i18n="tInventory">المتاع</span></button>
      <button data-panel="journal"><svg class="i"><use href="#i-book"/></svg><span data-i18n="tJournal">الدفتر</span></button>
      <button data-panel="people"><svg class="i"><use href="#i-people"/></svg><span data-i18n="tPeople">الناس</span></button>
      <button data-panel="map"><svg class="i"><use href="#i-map"/></svg><span data-i18n="tMap">الخريطة</span></button>
      <button data-panel="chronicle"><svg class="i"><use href="#i-scroll"/></svg><span data-i18n="tChronicle">التاريخ</span></button>
      <button data-panel="settings"><svg class="i"><use href="#i-gear"/></svg><span data-i18n="settings">الإعدادات</span></button>
    </nav>
  </section>

  <div id="sheet" class="sheet-wrap hidden"><aside class="side parchment" id="sideBody"></aside></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
